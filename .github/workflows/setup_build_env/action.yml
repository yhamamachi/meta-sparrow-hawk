name: Setup build environment
description: Setup build environment for Sparrow Hawk BSP
runs:
  using: "composite"
  steps:
    - name: Setup package
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping \
          libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect \
          python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd device-tree-compiler
        sudo apt-get install -y \
          lvm2 apparmor-utils apparmor
        # Clean up apt
        sudo apt autoremove -y
        sudo apt clean -y
        sudo apt autoclean -y
        df -h

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check disk and memory
      shell: bash
      run: |
        ls -lh
        df -h
        free -h

